# /etc/nginx/sites-available/stats.thomasbrandonhays.com
# Symlink into sites-enabled, then run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stats.thomasbrandonhays.com
# Certbot adds the 443 server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name stats.thomasbrandonhays.com;

    # Tracker payloads are small; keep the limit tight.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
