# Mirrors /etc/nginx/sites-available/stats.thomasbrandonhays.com.conf on the
# droplet. Tracked here so a server rebuild doesn't lose it — this file only
# lives on the droplet otherwise, nowhere in the deploy pipeline recreates it.
#
# The SSL/certbot-managed lines (marked "# managed by Certbot" below) are
# rewritten by `certbot renew` on its own schedule — if you hand-edit this
# file on the droplet, keep those lines and their markers intact so certbot
# keeps recognizing and maintaining them. After any edit here or there:
#   sudo nginx -t && sudo systemctl reload nginx
# and copy the result back into this file so the two don't drift.

server {
    server_name stats.thomasbrandonhays.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Umami's own app already sends frame-ancestors 'self' in its own CSP —
    # this duplicates it at the nginx level too (harmless; browsers
    # intersect multiple CSP headers rather than conflict) so the dashboard
    # is covered even if that ever changes upstream. This page is a login
    # screen; frame-ancestors is what stops another site from framing it to
    # trick a click.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Tracker payloads are small; keep the limit tight.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stats.thomasbrandonhays.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stats.thomasbrandonhays.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = stats.thomasbrandonhays.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name stats.thomasbrandonhays.com;
    return 404; # managed by Certbot
}
