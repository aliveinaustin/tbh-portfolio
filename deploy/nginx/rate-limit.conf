# Mirrors /etc/nginx/conf.d/rate-limit.conf on the droplet. Lives in the
# http context (nginx.conf includes conf.d/*.conf there) since limit_req_zone
# and map can't be declared inside a server block.
#
# Only POSTs count against the limit: the map keys GET/HEAD/etc. requests to
# an empty string, and nginx's documented behavior for an empty
# limit_req_zone key is to skip rate limiting for that request entirely.
map $request_method $post_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $post_limit_key zone=post_limit:10m rate=5r/m;
limit_req_status 429;
