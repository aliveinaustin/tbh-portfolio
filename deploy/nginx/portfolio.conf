# Mirrors /etc/nginx/sites-enabled/portfolio on the droplet. Tracked here so
# a server rebuild doesn't lose it — this file only lives on the droplet
# otherwise, nowhere in the deploy pipeline recreates it.
#
# The SSL/certbot-managed lines (marked "# managed by Certbot" below) are
# rewritten by `certbot renew` on its own schedule — if you hand-edit this
# file on the droplet, keep those lines and their markers intact so certbot
# keeps recognizing and maintaining them. After any edit here or there:
#   sudo nginx -t && sudo systemctl reload nginx
# and copy the result back into this file so the two don't drift.

server {
    server_name thomasbrandonhays.com www.thomasbrandonhays.com;

    # Static assets under /work/ served directly by nginx instead of being
    # proxied through Node — matched by extension, not by the /work/ prefix
    # alone, so the case-study page routes (/work/<slug>, no extension)
    # still fall through to the proxy_pass below untouched. `root`, not
    # `alias`: with a regex location, root appends the full request path
    # onto this directory, landing on the right file on its own.
    location ~ ^/work/.+\.(mp4|webm|webp|png|jpe?g)$ {
        root /var/www/portfolio/public;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thomasbrandonhays.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/thomasbrandonhays.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.thomasbrandonhays.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = thomasbrandonhays.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name thomasbrandonhays.com www.thomasbrandonhays.com;
    return 404; # managed by Certbot
}
